server:
  port: 8095
app:
  jwt:
    secret: "KMFZLQ3X0AEaQBVwFkrssIUJ6XG0pw67QXWxvK_MUppibhcL7Eh1r7fRDImeg6wE"
    issuer: org-access
spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: "jdbc:mysql://localhost:3306/inventory-service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "root"
    password: "root"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sync:
  service: inventory-service
  keys:
    inventory-service: ${INVENTORY_SYNC_KEY:}
    order-service: ${ORDER_SYNC_KEY:}
  targets:
    order-service: ${ORDER_SERVICE_URL:http://localhost:3311}
  routes:
    checkout-reservation-result: order-service
