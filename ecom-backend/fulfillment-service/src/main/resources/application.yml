server:
  port: 3315
app:
  jwt:
    secret: "KMFZLQ3X0AEaQBVwFkrssIUJ6XG0pw67QXWxvK_MUppibhcL7Eh1r7fRDImeg6wE"
    issuer: org-access
spring:
  application:
    name: fulfillment-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: "jdbc:mysql://localhost:3306/fulfillment-service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "root"
    password: "root"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false
    baseline-on-migrate: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sync:
  service: fulfillment-service
  keys:
    order-service: ${ORDER_SYNC_KEY:}
    payment-service: ${PAYMENT_SYNC_KEY:}
    fulfillment-service: ${FULFILLMENT_SYNC_KEY:}
  targets:
    order-service: ${ORDER_SERVICE_URL:http://localhost:3311}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:3314}
    fulfillment-service: ${FULFILLMENT_SERVICE_URL:http://localhost:3315}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:3317}
  routes:
    fulfillment: notification-service
