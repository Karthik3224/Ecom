server:
  port: ${SERVER_PORT:3315}
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:org-access}
spring:
  application:
    name: fulfillment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fulfillment-service}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sync:
  service: fulfillment-service
  keys:
    order-service: ${ORDER_SYNC_KEY:}
    payment-service: ${PAYMENT_SYNC_KEY:}
    fulfillment-service: ${FULFILLMENT_SYNC_KEY:}
  targets:
    order-service: ${ORDER_SERVICE_URL:http://localhost:3311}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:3314}
    fulfillment-service: ${FULFILLMENT_SERVICE_URL:http://localhost:3315}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:3317}
  routes:
    fulfillment: notification-service
