app:
  jwt:
    secret: qualification-only-secret-at-least-64-characters-not-for-deployment
    issuer: org-access
spring:
  application:
    name: order-service
  config:
    import: "optional:"
  datasource:
    url: jdbc:h2:mem:order_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
order:
  events:
    topic: order.events
