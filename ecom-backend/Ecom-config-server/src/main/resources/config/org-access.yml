server:
  port: ${SERVER_PORT:3310}

spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:users_roles}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
app:
  jwt:
    # Shared with services that validate org-access tokens.
    secret: "${JWT_SECRET:change-this-secret-to-a-long-random-string}"

# Downstream services called by the delivery-partner operations endpoints.
# Host defaults for native runs; override with container hostnames in Docker.
services:
  orders-url: "${ORDERS_SERVICE_URL:http://localhost:3311}"
  fulfillment-url: "${FULFILLMENT_SERVICE_URL:http://localhost:3315}"
  notifications-url: "${NOTIFICATIONS_SERVICE_URL:http://localhost:3317}"
