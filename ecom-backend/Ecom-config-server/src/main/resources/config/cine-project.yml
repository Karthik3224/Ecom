server:
  port: ${SERVER_PORT:8088}
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:cine_project}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:rootroot}
  jpa:
    hibernate.ddl-auto: update
app.jwt.secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string}
springdoc:
  swagger-ui:
    config-url: ${SWAGGER_CONFIG_URL:/cine-project/v3/api-docs/swagger-config}
    url: ${SWAGGER_API_DOCS_URL:/cine-project/v3/api-docs}
