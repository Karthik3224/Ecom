server:
  port: 8086

spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/Layout?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:rootroot}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"

app:
  jwt:
    # Must be identical to the secret used by org-access to sign tokens.
    secret: "${JWT_SECRET:change-this-secret-to-a-long-random-string}"
  kafka:
    booking-alert-topic: booking-alerts-topic
    house-created-topic: house-created-topic
